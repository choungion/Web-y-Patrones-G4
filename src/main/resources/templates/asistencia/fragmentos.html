
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <!-- Fragmento para registrar o modificar asistencia -->
    <section th:fragment="formulario">

        <div class="container mt-4">

            <div class="card shadow-sm">

                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Registro de Asistencia</h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/asistencia/guardar}"
                          th:object="${asistencia}"
                          method="post">

                        <input type="hidden"
                               th:field="*{idAsistencia}"/>

                        <div class="mb-3">
                            <label class="form-label">
                                Estudiante
                            </label>

                            <select class="form-select"
                                    th:field="*{estudiante.idEstudiante}"
                                    required>

                                <option value="">
                                    Seleccione un estudiante
                                </option>

                                <option th:each="e : ${estudiantes}"
                                        th:value="${e.idEstudiante}"
                                        th:text="${e.nombre + ' ' + e.apellido}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Curso
                            </label>

                            <select class="form-select"
                                    th:field="*{curso.idCurso}"
                                    required>

                                <option value="">
                                    Seleccione un curso
                                </option>

                                <option th:each="c : ${cursos}"
                                        th:value="${c.idCurso}"
                                        th:text="${c.nombre}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Fecha de la clase
                            </label>

                            <input type="date"
                                   class="form-control"
                                   th:field="*{fecha}"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Estado
                            </label>

                            <select class="form-select"
                                    th:field="*{estado}"
                                    required>

                                <option value="">
                                    Seleccione un estado
                                </option>

                                <option value="Presente">
                                    Presente
                                </option>

                                <option value="Ausente">
                                    Ausente
                                </option>

                                <option value="Justificado">
                                    Justificado
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Observaciones
                            </label>

                            <textarea class="form-control"
                                      th:field="*{observaciones}"
                                      rows="3">
                            </textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a th:href="@{/asistencia/listado}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-success">
                                Guardar asistencia
                            </button>

                        </div>

                    </form>

                </div>
            </div>
        </div>

    </section>


    <!-- Fragmento para mostrar el historial -->
    <section th:fragment="tablaHistorial">

        <div class="container mt-4">
            <div class="mb-3">
                <a th:href="@{/asistencia/nuevo}"
                   class="btn btn-success">
                    Registrar asistencia
                </a>
            </div>
            <div class="card shadow-sm">

                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Historial de Asistencia</h4>
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-striped table-hover">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Estudiante</th>
                                    <th>Curso</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                    <th>Observaciones</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="a : ${asistencias}">

                                    <td th:text="${a.idAsistencia}"></td>

                                    <td th:text="${a.estudiante.nombre
                                                  + ' '
                                                  + a.estudiante.apellido}">
                                    </td>

                                    <td th:text="${a.curso.nombre}"></td>

                                    <td th:text="${a.fecha}"></td>

                                    <td th:text="${a.estado}"></td>

                                    <td th:text="${a.observaciones}"></td>

                                    <td>

                                        <a th:href="@{/asistencia/modificar/{id}
                                            (id=${a.idAsistencia})}"
                                           class="btn btn-warning btn-sm">
                                            Modificar
                                        </a>

                                        <form th:action="@{/asistencia/eliminar}"
                                              method="post"
                                              class="d-inline">

                                            <input type="hidden"
                                                   name="idAsistencia"
                                                   th:value="${a.idAsistencia}"/>

                                            <button type="submit"
                                                    class="btn btn-danger btn-sm"
                                                    onclick="return confirm('¿Desea eliminar este registro?')">
                                                Eliminar
                                            </button>

                                        </form>

                                        <a th:href="@{/asistencia/historial/{id}
                                            (id=${a.estudiante.idEstudiante})}"
                                           class="btn btn-info btn-sm">
                                            Historial
                                        </a>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>
                </div>
            </div>
        </div>

    </section>

</html>
