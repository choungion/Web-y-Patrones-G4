<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
    <title>Mis notificaciones</title>
</head>

<body>

<div th:replace="~{general/fragmentos :: header}"></div>

<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-success text-white">
            <h3>
                Mis notificaciones
            </h3>
        </div>

        <div class="card-body">

            <div th:if="${comunicados == null or comunicados.empty}"
                 class="alert alert-info">
                No tienes notificaciones recibidas.
            </div>

            <div th:each="comunicado : ${comunicados}"
                 class="card mb-3">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <h5 class="card-title"
                            th:text="${comunicado.titulo}">
                        </h5>

                        <small class="text-muted"
                               th:text="${comunicado.fechaEnvio}">
                        </small>

                    </div>

                    <p class="card-text"
                       th:text="${comunicado.mensaje}">
                    </p>

                </div>

            </div>

        </div>
    </div>

</div>

<div th:replace="~{general/fragmentos :: footer}"></div>

</body>
</html>
