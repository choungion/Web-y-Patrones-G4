<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
    <title>Comunicados enviados</title>
</head>

<body>

<div th:replace="~{general/fragmentos :: header}"></div>

<div class="container mt-4">

    <div th:if="${todoOK != null}"
         class="alert alert-success"
         th:text="${todoOK}">
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Comunicados enviados</h2>

        <a th:href="@{/comunicado/nuevo}"
           class="btn btn-success">
            Nuevo comunicado
        </a>

    </div>

    <div class="card">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>
                        <tr>
                            <th>Destinatario</th>
                            <th>Título</th>
                            <th>Mensaje</th>
                            <th>Fecha de envío</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="comunicado : ${comunicados}">

                            <td th:text="${comunicado.estudiante.nombre + ' ' + comunicado.estudiante.apellido}">
                            </td>

                            <td th:text="${comunicado.titulo}">
                            </td>

                            <td th:text="${comunicado.mensaje}">
                            </td>

                            <td th:text="${comunicado.fechaEnvio}">
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div th:if="${comunicados == null or comunicados.empty}"
                 class="alert alert-info">
                No hay comunicados enviados.
            </div>

        </div>
    </div>

</div>

<div th:replace="~{general/fragmentos :: footer}"></div>

</body>
</html>
