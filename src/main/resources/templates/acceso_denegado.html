<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <div class="row my-5">
            <div class="col-md-4 offset-md-4">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white text-center">
                        <h2><i class="fa-solid fa-triangle-exclamation"></i> [[#{error}]]</h2>
                    </div>
                    <div class="card-body text-center">
                        <h5>[[#{error.recurso.acceso}]]</h5>
                        <a th:href="@{/}" class="btn btn-primary mt-3">
                            <i class="fa-solid fa-house"></i> [[#{plantilla.inicio}]]</a>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
