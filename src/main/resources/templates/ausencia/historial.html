<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}">
    <title>Historial de ausencias</title>
</head>

<body>
<div th:replace="~{general/fragmentos :: header}"></div>
    
<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-success text-white">
            <h3>Historial de ausencias</h3>
        </div>

        <div class="card-body">

            <table class="table table-striped table-bordered">

                <thead>
                    <tr>
                        <th>Estudiante</th>
                        <th>Curso</th>
                        <th>Fecha de ausencia</th>
                        <th>Motivo</th>
                        <th>Fecha de registro</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="ausencia : ${ausencias}">

                        <td th:text="${ausencia.estudiante.nombre + ' ' + ausencia.estudiante.apellido}">
                            Estudiante
                        </td>

                        <td th:text="${ausencia.curso.nombre}">
                            Curso
                        </td>

                        <td th:text="${ausencia.fechaAusencia}">
                            Fecha
                        </td>

                        <td th:text="${ausencia.motivo}">
                            Motivo
                        </td>

                        <td th:text="${ausencia.fechaRegistro}">
                            Registro
                        </td>

                    </tr>

                </tbody>

            </table>

            <a th:href="@{/ausencia/nuevo}"
               class="btn btn-success">
                Notificar nueva ausencia
            </a>

        </div>
    </div>

</div>

<div th:replace="~{general/fragmentos :: footer}"></div>

</body>
</html>
