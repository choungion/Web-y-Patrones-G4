# Nosotros
nosotros.mensaje= Hola, soy Jennifer Ramos, fundadora de TARU Centro de Artes. Soy bachiller en Danza por la Universidad Nacional de Costa Rica y cuento con experiencia como integrante de la Compa\u00f1\u00eda Nacional de Danza. 
nosotros.mensaje2=Mi pasi\u00f3n por el movimiento, la expresi\u00f3n art\u00edstica y la ense\u00f1anza me motiv\u00f3 a crear un espacio donde personas de todas las edades puedan desarrollar sus habilidades, fortalecer su confianza y disfrutar del arte a trav\u00e9s del movimiento.TARU Centro de Artes naci\u00f3 en 2025 en Nicoya con el prop\u00f3sito de ampliar la oferta cultural de la regi\u00f3n, ofreciendo disciplinas innovadoras y accesibles para la comunidad. Nuestro centro brinda clases de danza contempor\u00e1nea, gimnasia y macrogimnasia, promoviendo un ambiente inclusivo que fomenta el desarrollo f\u00edsico, art\u00edstico y personal de cada estudiante, sin importar su nivel de experiencia.
nosotros.parrafo1=Hola, soy Jennifer Ramos, fundadora de TARU Centro de Artes. Soy bachiller en Danza por la Universidad Nacional de Costa Rica y cuento con experiencia como integrante de la Compa\u00f1\u00eda Nacional de Danza. Mi pasi\u00f3n por el movimiento, la expresi\u00f3n art\u00edstica y la ense\u00f1anza me motiv\u00f3 a crear un espacio donde personas de todas las edades puedan desarrollar sus habilidades, fortalecer su confianza y disfrutar del arte.
nosotros.parrafo2=TARU Centro de Artes naci\u00f3 en 2025 en Nicoya con el prop\u00f3sito de ampliar la oferta cultural de la regi\u00f3n, ofreciendo disciplinas innovadoras y accesibles para la comunidad. Brindamos clases de danza contempor\u00e1nea, gimnasia y macrogimnasia en un ambiente inclusivo que promueve el desarrollo f\u00edsico, art\u00edstico y personal de cada estudiante.
nosotros.mision=Brindar un espacio art\u00edstico y formativo donde ni\u00f1os, j\u00f3venes y adultos desarrollen sus habilidades mediante la danza contempor\u00e1nea, la gimnasia y la macrogimnasia, promoviendo la creatividad, el bienestar f\u00edsico, la disciplina y la confianza en un ambiente inclusivo y de respeto.
nosotros.vision=Ser un centro de artes reconocido en Guanacaste por inspirar el desarrollo integral de las personas a trav\u00e9s del movimiento y la expresi\u00f3n art\u00edstica, fortaleciendo la cultura y convirti\u00e9ndose en un referente de innovaci\u00f3n, calidad y compromiso con la comunidad.

